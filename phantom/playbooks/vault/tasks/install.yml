---
# Vaultwarden installation from the official container image

- name: Check for unsupported 32-bit ARM architecture
  fail:
    msg: "Vaultwarden does not support 32-bit ARM (armv7l). Use a 64-bit OS (aarch64) or x86_64 system."
  when: ansible_architecture == "armv7l"

- name: Install prerequisites
  apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
      - curl
      - ca-certificates
      - docker.io
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Enable and start Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Create vaultwarden system user
  user:
    name: vaultwarden
    system: true
    shell: /usr/sbin/nologin
    home: /opt/vaultwarden
    create_home: false
  register: vaultwarden_user

- name: Create Vaultwarden directories
  file:
    path: "{{ item }}"
    state: directory
    owner: vaultwarden
    group: vaultwarden
    mode: "0750"
  loop:
    - /opt/vaultwarden
    - /opt/vaultwarden/data

- name: Pull the official Vaultwarden image
  command: docker pull ghcr.io/dani-garcia/vaultwarden:latest
  register: vaultwarden_pull
  changed_when: "'Downloaded newer image' in vaultwarden_pull.stdout"
  retries: 3
  delay: 10
  until: vaultwarden_pull is success

- name: Allow HTTP/HTTPS through UFW
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"
