---
# Vaultwarden service configuration

- name: Deploy Vaultwarden environment file
  copy:
    dest: /opt/vaultwarden/.env
    content: |
      DOMAIN=https://{{ vaultwarden_domain }}
      SIGNUPS_ALLOWED={{ vaultwarden_signups | lower }}
      ADMIN_TOKEN={{ vaultwarden_admin_token }}
      ROCKET_ADDRESS=0.0.0.0
      ROCKET_PORT=8081
      DATA_FOLDER=/data
      LOG_FILE=/data/vaultwarden.log
      LOG_LEVEL=warn
      SENDS_ALLOWED=true
      EMERGENCY_ACCESS_ALLOWED=true
    owner: vaultwarden
    group: vaultwarden
    mode: "0600"
  no_log: true
  notify: restart vaultwarden

- name: Deploy Vaultwarden systemd unit
  copy:
    dest: /etc/systemd/system/vaultwarden.service
    content: |
      [Unit]
      Description=Vaultwarden (Bitwarden-compatible server)
      Documentation=https://github.com/dani-garcia/vaultwarden
      After=docker.service network-online.target
      Requires=docker.service

      [Service]
      ExecStartPre=-/usr/bin/docker rm -f vaultwarden
      ExecStart=/usr/bin/docker run --rm --name vaultwarden \
        --user {{ vaultwarden_user.uid }}:{{ vaultwarden_user.group }} \
        --env-file /opt/vaultwarden/.env \
        --publish 127.0.0.1:8081:8081 \
        --volume /opt/vaultwarden/data:/data \
        ghcr.io/dani-garcia/vaultwarden:latest
      ExecStop=/usr/bin/docker stop vaultwarden
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: restart vaultwarden

- name: Reload systemd daemon
  systemd:
    daemon_reload: true

- name: Enable and start Vaultwarden
  service:
    name: vaultwarden
    state: started
    enabled: true

- name: Wait for Vaultwarden to be ready
  wait_for:
    port: 8081
    host: 127.0.0.1
    delay: 3
    timeout: 90
