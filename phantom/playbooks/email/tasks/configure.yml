---
# Mail-in-a-Box non-interactive installation

- name: Generate admin password
  command: openssl rand -base64 16
  register: miab_admin_password
  args:
    creates: /root/.miab_admin_password

- name: Save admin password
  copy:
    content: "{{ miab_admin_password.stdout }}"
    dest: /root/.miab_admin_password
    mode: "0600"
  when: miab_admin_password.changed

- name: Read saved admin password
  slurp:
    src: /root/.miab_admin_password
  register: miab_password_file

- name: Clone Mail-in-a-Box repository
  git:
    repo: https://github.com/mail-in-a-box/mailinabox.git
    dest: /opt/mailinabox
    version: main
    depth: 1

- name: Install Mail-in-a-Box without exposing installer credentials
  block:
    - name: Write root-only Mail-in-a-Box installer environment
      copy:
        content: |
          DEBIAN_FRONTEND=noninteractive
          NONINTERACTIVE=1
          PRIMARY_HOSTNAME={{ miab_domain | quote }}
          EMAIL_ADDR={{ miab_first_user | quote }}
          EMAIL_PW={{ (miab_password_file.content | b64decode).strip() | quote }}
          PUBLIC_IP={{ ansible_host | quote }}
          PUBLIC_IPV6=auto
          STORAGE_USER=user-data
          STORAGE_ROOT=/home/user-data
          SKIP_NETWORK_CHECKS={{ '1' if (email_skip_network_checks | default(false) | bool) else "''" }}
        dest: /root/.miab-install.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Run Mail-in-a-Box installer (non-interactive)
      shell: |
        set -e
        set -a
        . /root/.miab-install.env
        set +a
        bash setup/start.sh
        install -d -m 0755 /var/lib/c2itall
        touch /var/lib/c2itall/mailinabox-installed
      args:
        chdir: /opt/mailinabox
        creates: /var/lib/c2itall/mailinabox-installed
        executable: /bin/bash
      register: miab_install
      retries: 3
      delay: 30
      until: miab_install is succeeded
      timeout: 1800
  always:
    - name: Remove Mail-in-a-Box installer environment
      file:
        path: /root/.miab-install.env
        state: absent

- name: Display admin credentials
  debug:
    msg: >
      Mail-in-a-Box installed. Admin: {{ miab_first_user }}
      Password saved to /root/.miab_admin_password
      Web admin: https://{{ miab_domain }}/admin
