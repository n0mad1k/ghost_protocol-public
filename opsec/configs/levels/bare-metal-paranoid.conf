# /etc/opsec/levels/bare-metal-paranoid.conf — Physical Attack Box (Paranoid)
# Maximum security always on. Ghost mode is the default — cannot be disabled.
# Apply via: sudo opsec-config.sh --level apply bare-metal-paranoid

# ─── LEVEL TYPE ───────────────────────────────────────────────────────────────
# paranoid = ghost mode always on, cannot disable
LEVEL_TYPE="paranoid"

# ─── ACTIVE PROFILE ────────────────────────────────────────────────────────────
PROFILE_NAME="default"

# ─── BASE STATE ───────────────────────────────────────────────────────────────
BASE_DNS="quad9"
BASE_MAC_RANDOMIZE="1"
BASE_IPV6_DISABLE="1"

# ─── TOR SETTINGS ─────────────────────────────────────────────────────────────
TOR_CIRCUIT_ROTATION=""
TOR_BLACKLIST=""
TOR_STRICT_NODES=""
TOR_ISOLATION="1"
TOR_PADDING=""
TOR_SOCKS_PORT="9050"
TOR_DNS_PORT="5353"
TOR_NUM_GUARDS=""
TOR_SAFE_LOGGING="1"

# ─── DNS SETTINGS ─────────────────────────────────────────────────────────────
DNS_MODE="tor"
DNS_CUSTOM_SERVERS=""

# ─── KILL SWITCH ───────────────────────────────────────────────────────────────
KILLSWITCH_ALLOW_DHCP="1"
KILLSWITCH_ALLOW_OPENVPN="1"
KILLSWITCH_ALLOW_WIREGUARD="1"
KILLSWITCH_EXTRA_PORTS=""

# ─── MAC ADDRESS ───────────────────────────────────────────────────────────────
MAC_INTERFACES="auto"
MAC_VENDOR_SPOOF=""

# ─── HOSTNAME ──────────────────────────────────────────────────────────────────
HOSTNAME_PATTERN="random"
HOSTNAME_CUSTOM_PREFIX="workstation"

# ─── SYSTEM HARDENING ──────────────────────────────────────────────────────────
HARDEN_IPV6="1"
HARDEN_SWAP="1"
HARDEN_CORE_DUMPS="1"
HARDEN_CLIPBOARD_CLEAR="1"
HARDEN_SCREEN_LOCK="1"
HARDEN_SCREEN_LOCK_TIMEOUT="300"
HARDEN_TIMEZONE_SPOOF="1"
HARDEN_TIMEZONE_VALUE="UTC"
HARDEN_LOCALE_SPOOF="1"
HARDEN_LOCALE_VALUE="en_US.UTF-8"

# ─── LEAK PREVENTION ──────────────────────────────────────────────────────────
LEAK_WEBRTC_BLOCK="1"
LEAK_USB_BLOCK="1"

# ─── MONITORING ────────────────────────────────────────────────────────────────
MONITOR_PROCESSES="1"
MONITOR_LOG_ROTATION="1"
LOG_ROTATION_HOURS="1"

# ─── TRAFFIC SHAPING ──────────────────────────────────────────────────────────
TRAFFIC_JITTER_ENABLED="0"
TRAFFIC_JITTER_MS="50"
TRAFFIC_BLEND_ENABLED="0"

# ─── TOR BRIDGES ──────────────────────────────────────────────────────────────
TOR_BRIDGE_MODE="off"
TOR_BRIDGE_RELAY=""

# ─── ANTI-FORENSICS ──────────────────────────────────────────────────────────
WIPE_METHOD="auto"

# ─── DEPLOYMENT LEVEL ─────────────────────────────────────────────────────────
DEPLOYMENT_LEVEL="bare-metal-paranoid"

# ─── TERMINAL BANNER ──────────────────────────────────────────────────────────
OPSEC_BANNER="compact"
